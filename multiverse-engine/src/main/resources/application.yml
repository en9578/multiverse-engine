server:
  port: 8080

spring:
  profiles:
    active: dev
  application:
    name: multiverse-engine
  datasource:
    url: jdbc:mysql://localhost:3306/multiverse?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    encoding: UTF-8
  ai:
    openai:
      # token-plan 团队 key 仅支持 OpenAI 兼容协议（标准 dashscope.aliyuncs.com 对该 key 返回 401）
      base-url: https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode
      chat:
        completions-path: /v1/chat/completions
      # Demo 缺省占位 key；正式运行须设置 DASHSCOPE_API_KEY 环境变量
      api-key: ${DASHSCOPE_API_KEY:sk-dev-placeholder}

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.minbao.multiverse.domain.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.minbao.multiverse: debug
    org.springframework: warn
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [%X{traceId}] - %msg%n"
